<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google-site-verification" content="t4FJ_daYfcs8uqmho_BDE5Sj6s7ccLArRSoG68DYU" />
<meta name="description" content="MASHRO3: أدوات مالية وأفكار مشاريع وخطة تنفيذ مبسطة.">
<meta name="theme-color" content="#102a43">
<title>MASHRO3 | مشروعك يبدأ بفكرة</title>
<style>
:root{--navy:#102a43;--blue:#174b66;--teal:#12b8a6;--gold:#ffcb69;--bg:#f3f7fb;--ink:#1c2b39;--muted:#657789;--line:#dfe8ef;--soft:#eaf8f6;--shadow:0 9px 26px #102a4310}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.shell{max-width:1200px;margin:auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--navy);color:#fff;padding:17px 20px;border-radius:22px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--teal),#8aeadc);display:grid;place-items:center;color:var(--navy);font-weight:900;font-size:25px}
.brand h1{margin:0;font-size:23px}
.brand p{margin:0;color:#d2e0e9;font-size:12px}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.currency{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:#ffffff12;border:1px solid #ffffff2b;padding:7px 9px;border-radius:12px;font-size:12px}
.currency select,.currency input{max-width:140px;border:0;border-radius:8px;padding:6px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}
nav button,.tab{border:1px solid var(--line);background:white;color:var(--navy);padding:9px 13px;border-radius:12px;font-weight:800}
nav button.active,nav button:hover,.tab.active{background:var(--navy);color:#fff}
.page{display:none}
.page.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(120deg,var(--navy),var(--blue),#087f78);color:white;padding:clamp(22px,4vw,44px);border-radius:25px;display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:center}
.eyebrow{color:var(--gold);font-weight:900;font-size:13px}
.hero h2{font-size:clamp(29px,4vw,46px);line-height:1.25;margin:9px 0}
.hero p{color:#dceaf1}
.art{display:grid;place-items:center;min-height:170px;font-size:100px;filter:drop-shadow(0 15px 14px #0002)}
.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.primary{background:var(--teal);color:#073b3b}
.dark{background:var(--navy);color:#fff}
.light{background:#fff;color:var(--navy)}
.outline{background:transparent;border:1px solid var(--line);color:var(--navy)}
.gold{background:var(--gold);color:#4a350e}
.danger{background:#fff0f0;color:#b33b45}
.smallbtn{font-size:12px;padding:7px 10px}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:26px 0 13px}
.head h2,.head h3{margin:0;color:var(--navy)}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 7px;color:var(--navy)}
.card p{color:var(--muted);margin:7px 0}
.icon{font-size:25px;background:var(--soft);width:46px;height:46px;display:grid;place-items:center;border-radius:14px;margin-bottom:12px}
.tool{display:flex;flex-direction:column;align-items:flex-start}
.tool .btn{margin-top:auto}
.pill{display:inline-block;background:#eef5fa;color:#36576d;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:800}
.notice{background:#fff8e8;border:1px solid #f3dfa9;color:#76551b;padding:12px 14px;border-radius:13px;margin:14px 0}
.good{background:var(--soft);border:1px solid #bcebe2;color:#17645e;padding:12px 14px;border-radius:13px;margin:14px 0}
.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}
.field label{font-size:13px;font-weight:800;color:#425a6d}
.field input,.field select,.field textarea,.search{width:100%;padding:11px;border:1px solid #cedbe5;background:#fbfdff;border-radius:10px;color:var(--ink)}
.result{background:#eefaf7;border:1px solid #c4eee5;padding:13px;border-radius:12px;margin-top:12px}
.result strong{color:#087f73;font-size:19px}
.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.detail{display:none}
.detail.active{display:block}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;background:white;border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.idea{display:flex;flex-direction:column;gap:8px}
.idea .bottom{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.metric{background:white;border:1px solid var(--line);padding:16px;border-radius:16px}
.metric .label{font-size:13px;color:var(--muted)}
.metric .value{font-size:25px;font-weight:900;color:var(--navy)}
.progress{height:9px;background:#e6edf2;border-radius:99px;overflow:hidden;margin:9px 0}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#75ddce);width:0}
.checkline{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.checkline input{width:18px;height:18px;margin-top:7px;accent-color:var(--teal)}
.empty{text-align:center;color:var(--muted);padding:23px;border:1px dashed #cbd8e1;border-radius:14px;background:#fbfdff}
.searchrow{display:flex;gap:8px;margin:10px 0}
.searchrow input{flex:1;min-width:0}
.searchresults{display:flex;gap:8px;flex-wrap:wrap}
.searchresults button{background:white;border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--navy)}
.quizoption{display:block;text-align:right;width:100%;background:white;border:1px solid var(--line);border-radius:11px;padding:11px;margin:8px 0}
.quizoption.correct{background:#e7fbf3;border-color:#209b76}
.quizoption.wrong{background:#fff0f0;border-color:#d45d64}
.quizoption:disabled{cursor:default}
.table{width:100%;border-collapse:collapse;margin-top:10px}
.table td,.table th{text-align:right;padding:9px;border-bottom:1px solid var(--line)}
.table th{background:#f4f8fb;color:var(--navy)}
.hidden{display:none!important}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
.toast{position:fixed;bottom:16px;left:16px;background:var(--navy);color:white;border-radius:11px;padding:12px 16px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
.toast.show{opacity:1}
.muted{color:var(--muted)}
@media(max-width:800px){
header{align-items:flex-start;flex-direction:column}
.hero{grid-template-columns:1fr}
.art{min-height:100px;font-size:75px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.filters{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:540px){
.shell{padding:9px}
header{padding:14px;border-radius:17px}
.brand h1{font-size:20px}
nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
nav button{padding:9px 5px}
.hero{padding:22px;border-radius:19px}
.grid,.two{grid-template-columns:1fr}
.fieldgrid{grid-template-columns:1fr}
.filters{grid-template-columns:1fr 1fr}
.card{padding:15px}
.head{align-items:flex-start;flex-direction:column}
}
</style>
</head>
